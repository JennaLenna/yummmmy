<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Equation Balancer Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .equation-input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .molecules-section {
            margin-bottom: 30px;
        }

        .molecules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .molecule-control {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }

        .molecule-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .coefficient-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arrow-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .arrow-btn:hover {
            background: #5568d3;
        }

        .arrow-btn:active {
            transform: scale(0.95);
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .molecule-notes {
            margin-top: 10px;
        }

        .notes-textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            min-height: 50px;
            transition: border-color 0.3s;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .notes-textarea::placeholder {
            color: #999;
            font-style: italic;
        }

        .atom-counts-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .atom-counts-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .atom-counts-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: start;
        }

        .side-label {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .atom-list {
            list-style: none;
        }

        .atom-item {
            padding: 8px;
            margin-bottom: 5px;
            background: white;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .atom-symbol {
            font-weight: 600;
            color: #333;
        }

        .atom-count {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .balanced {
            background: #10b981;
        }

        .unbalanced {
            background: #ef4444;
        }

        .arrow-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fcc;
        }

        .hidden {
            display: none;
        }

        .balance-status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .balance-status.balanced {
            background: #d1fae5;
            color: #065f46;
        }

        .balance-status.unbalanced {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚗️ Chemical Equation Balancer Practice</h1>
        <p class="subtitle">Balance equations by adjusting coefficients - the tool won't solve it for you!</p>

        <div class="equation-input-section">
            <label for="equation-input">Enter your chemical equation:</label>
            <input 
                type="text" 
                id="equation-input" 
                placeholder="e.g., H2 + O2 -> H2O"
                value="H2 + O2 -> H2O"
            >
            <p class="help-text">Use -> or = to separate reactants and products. Use + to separate molecules.</p>
        </div>

        <div id="error-container" class="error-message hidden"></div>

        <div class="molecules-section">
            <label>Adjust coefficients:</label>
            <div id="molecules-container" class="molecules-grid"></div>
        </div>

        <div class="atom-counts-section">
            <h3 class="atom-counts-title">Atom Counts</h3>
            <div class="atom-counts-grid">
                <div>
                    <div class="side-label">Reactants (Left)</div>
                    <ul id="reactants-atoms" class="atom-list"></ul>
                </div>
                <div class="arrow-divider">→</div>
                <div>
                    <div class="side-label">Products (Right)</div>
                    <ul id="products-atoms" class="atom-list"></ul>
                </div>
            </div>
            <div id="balance-status" class="balance-status hidden"></div>
        </div>
    </div>

    <script>
        class ChemicalEquationBalancer {
            constructor() {
                this.equationInput = document.getElementById('equation-input');
                this.moleculesContainer = document.getElementById('molecules-container');
                this.reactantsAtoms = document.getElementById('reactants-atoms');
                this.productsAtoms = document.getElementById('products-atoms');
                this.errorContainer = document.getElementById('error-container');
                this.balanceStatus = document.getElementById('balance-status');
                
                this.coefficients = {};
                this.notes = {};
                this.equation = null;
                
                this.init();
            }

            init() {
                this.equationInput.addEventListener('input', () => this.parseEquation());
                this.parseEquation();
            }

            parseEquation() {
                try {
                    const input = this.equationInput.value.trim();
                    if (!input) {
                        this.showError('Please enter a chemical equation');
                        return;
                    }

                    // Split by arrow (-> or =)
                    const parts = input.split(/->|=/).map(s => s.trim());
                    if (parts.length !== 2) {
                        this.showError('Equation must have reactants and products separated by -> or =');
                        return;
                    }

                    const [reactantsStr, productsStr] = parts;
                    
                    // Parse reactants and products
                    const reactants = this.parseMolecules(reactantsStr);
                    const products = this.parseMolecules(productsStr);

                    if (reactants.length === 0 || products.length === 0) {
                        this.showError('Both sides must have at least one molecule');
                        return;
                    }

                    this.equation = { reactants, products };
                    this.hideError();
                    this.initializeCoefficients();
                    this.render();
                } catch (error) {
                    this.showError(error.message);
                }
            }

            parseMolecules(str) {
                return str.split('+').map(s => s.trim()).filter(s => s.length > 0);
            }

            initializeCoefficients() {
                const allMolecules = [...this.equation.reactants, ...this.equation.products];
                allMolecules.forEach(molecule => {
                    if (!(molecule in this.coefficients)) {
                        this.coefficients[molecule] = 1;
                    }
                    if (!(molecule in this.notes)) {
                        this.notes[molecule] = '';
                    }
                });

                // Remove coefficients and notes for molecules no longer in equation
                Object.keys(this.coefficients).forEach(molecule => {
                    if (!allMolecules.includes(molecule)) {
                        delete this.coefficients[molecule];
                        delete this.notes[molecule];
                    }
                });
            }

            parseMolecule(formula) {
                // Parse a chemical formula like H2O, Ca(OH)2, etc.
                const atoms = {};
                let i = 0;
                
                while (i < formula.length) {
                    // Skip coefficient at the beginning (we handle it separately)
                    if (i === 0 && /\d/.test(formula[i])) {
                        while (i < formula.length && /\d/.test(formula[i])) {
                            i++;
                        }
                        continue;
                    }

                    // Handle parentheses
                    if (formula[i] === '(') {
                        const closeIdx = formula.indexOf(')', i);
                        if (closeIdx === -1) throw new Error('Unmatched parentheses in ' + formula);
                        
                        const insideParens = formula.substring(i + 1, closeIdx);
                        let multiplier = '';
                        let j = closeIdx + 1;
                        while (j < formula.length && /\d/.test(formula[j])) {
                            multiplier += formula[j];
                            j++;
                        }
                        multiplier = multiplier ? parseInt(multiplier) : 1;
                        
                        const subAtoms = this.parseMolecule(insideParens);
                        for (const [atom, count] of Object.entries(subAtoms)) {
                            atoms[atom] = (atoms[atom] || 0) + count * multiplier;
                        }
                        
                        i = j;
                        continue;
                    }

                    // Handle regular elements
                    if (/[A-Z]/.test(formula[i])) {
                        let element = formula[i];
                        i++;
                        
                        // Add lowercase letters
                        while (i < formula.length && /[a-z]/.test(formula[i])) {
                            element += formula[i];
                            i++;
                        }
                        
                        // Get count
                        let count = '';
                        while (i < formula.length && /\d/.test(formula[i])) {
                            count += formula[i];
                            i++;
                        }
                        count = count ? parseInt(count) : 1;
                        
                        atoms[element] = (atoms[element] || 0) + count;
                        continue;
                    }

                    i++;
                }
                
                return atoms;
            }

            countAtoms(molecules, coefficients) {
                const atomCounts = {};
                
                molecules.forEach(molecule => {
                    const coefficient = coefficients[molecule] || 1;
                    const atoms = this.parseMolecule(molecule);
                    
                    for (const [atom, count] of Object.entries(atoms)) {
                        atomCounts[atom] = (atomCounts[atom] || 0) + count * coefficient;
                    }
                });
                
                return atomCounts;
            }

            updateCoefficient(molecule, value) {
                value = Math.max(0, parseInt(value) || 0);
                this.coefficients[molecule] = value;
                this.updateAtomCounts();
                this.updateBalanceStatus();
            }

            updateNote(molecule, value) {
                this.notes[molecule] = value;
            }

            increment(molecule) {
                this.coefficients[molecule] = (this.coefficients[molecule] || 0) + 1;
                this.updateAtomCounts();
                this.updateBalanceStatus();
                document.getElementById(`coeff-${this.sanitizeId(molecule)}`).value = this.coefficients[molecule];
            }

            decrement(molecule) {
                this.coefficients[molecule] = Math.max(0, (this.coefficients[molecule] || 1) - 1);
                this.updateAtomCounts();
                this.updateBalanceStatus();
                document.getElementById(`coeff-${this.sanitizeId(molecule)}`).value = this.coefficients[molecule];
            }

            sanitizeId(str) {
                return str.replace(/[^a-zA-Z0-9]/g, '_');
            }

            renderMoleculeControls() {
                this.moleculesContainer.innerHTML = '';
                
                const allMolecules = [...this.equation.reactants, ...this.equation.products];
                
                allMolecules.forEach((molecule, index) => {
                    const isReactant = this.equation.reactants.includes(molecule);
                    const side = isReactant ? 'Reactant' : 'Product';
                    
                    const control = document.createElement('div');
                    control.className = 'molecule-control';
                    control.innerHTML = `
                        <div class="molecule-label">${molecule} (${side})</div>
                        <div class="coefficient-control">
                            <button class="arrow-btn" onclick="balancer.decrement('${molecule}')">−</button>
                            <input 
                                type="number" 
                                id="coeff-${this.sanitizeId(molecule)}"
                                value="${this.coefficients[molecule] || 1}" 
                                min="0"
                                onchange="balancer.updateCoefficient('${molecule}', this.value)"
                            >
                            <button class="arrow-btn" onclick="balancer.increment('${molecule}')">+</button>
                        </div>
                        <div class="molecule-notes">
                            <textarea 
                                class="notes-textarea"
                                placeholder="Add notes about ${molecule}..."
                                oninput="balancer.updateNote('${molecule}', this.value)"
                            >${this.notes[molecule] || ''}</textarea>
                        </div>
                    `;
                    
                    this.moleculesContainer.appendChild(control);
                });
            }

            updateAtomCounts() {
                const reactantAtoms = this.countAtoms(this.equation.reactants, this.coefficients);
                const productAtoms = this.countAtoms(this.equation.products, this.coefficients);
                
                // Get all unique atoms
                const allAtoms = new Set([...Object.keys(reactantAtoms), ...Object.keys(productAtoms)]);
                
                this.reactantsAtoms.innerHTML = '';
                this.productsAtoms.innerHTML = '';
                
                allAtoms.forEach(atom => {
                    const leftCount = reactantAtoms[atom] || 0;
                    const rightCount = productAtoms[atom] || 0;
                    const balanced = leftCount === rightCount && leftCount > 0;
                    
                    const leftItem = document.createElement('li');
                    leftItem.className = 'atom-item';
                    leftItem.innerHTML = `
                        <span class="atom-symbol">${atom}</span>
                        <span class="atom-count ${balanced ? 'balanced' : 'unbalanced'}">${leftCount}</span>
                    `;
                    this.reactantsAtoms.appendChild(leftItem);
                    
                    const rightItem = document.createElement('li');
                    rightItem.className = 'atom-item';
                    rightItem.innerHTML = `
                        <span class="atom-symbol">${atom}</span>
                        <span class="atom-count ${balanced ? 'balanced' : 'unbalanced'}">${rightCount}</span>
                    `;
                    this.productsAtoms.appendChild(rightItem);
                });
            }

            updateBalanceStatus() {
                const reactantAtoms = this.countAtoms(this.equation.reactants, this.coefficients);
                const productAtoms = this.countAtoms(this.equation.products, this.coefficients);
                
                const allAtoms = new Set([...Object.keys(reactantAtoms), ...Object.keys(productAtoms)]);
                
                let isBalanced = true;
                for (const atom of allAtoms) {
                    if ((reactantAtoms[atom] || 0) !== (productAtoms[atom] || 0)) {
                        isBalanced = false;
                        break;
                    }
                }
                
                // Check if all coefficients are non-zero
                const hasZeroCoefficient = Object.values(this.coefficients).some(c => c === 0);
                if (hasZeroCoefficient) {
                    isBalanced = false;
                }
                
                this.balanceStatus.classList.remove('hidden');
                if (isBalanced) {
                    this.balanceStatus.textContent = '✓ Equation is balanced!';
                    this.balanceStatus.className = 'balance-status balanced';
                } else {
                    this.balanceStatus.textContent = '✗ Equation is not balanced yet';
                    this.balanceStatus.className = 'balance-status unbalanced';
                }
            }

            render() {
                this.renderMoleculeControls();
                this.updateAtomCounts();
                this.updateBalanceStatus();
            }

            showError(message) {
                this.errorContainer.textContent = message;
                this.errorContainer.classList.remove('hidden');
                this.moleculesContainer.innerHTML = '';
                this.reactantsAtoms.innerHTML = '';
                this.productsAtoms.innerHTML = '';
                this.balanceStatus.classList.add('hidden');
            }

            hideError() {
                this.errorContainer.classList.add('hidden');
            }
        }

        // Initialize the app
        const balancer = new ChemicalEquationBalancer();
    </script>
</body>
</html>
